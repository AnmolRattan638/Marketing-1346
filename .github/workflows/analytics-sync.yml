name: Analytics sync

# Pulls post and follower numbers from Instagram, LinkedIn and Bluesky into data/analytics.json so the strategist
# works from real numbers. Meta data can lag up to 48 hours, so every 6 hours is as fresh as it gets.
on:
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analytics-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_PUBLIC_HANDLE: ${{ vars.BLUESKY_PUBLIC_HANDLE }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_API_VERSION: ${{ vars.IG_API_VERSION }}
      ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Sync analytics
        run: python -m src.sync_analytics

      - name: Save analytics
        if: always()
        run: |
          bash scripts/commit_state.sh "analytics: $(date -u +%FT%TZ)"
