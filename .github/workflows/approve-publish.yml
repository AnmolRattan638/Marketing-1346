name: Approve and publish

on:
  schedule:
    - cron: "*/15 * * * *"    # checks Telegram for Approve/Reject taps
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marketing-state
  cancel-in-progress: false

jobs:
  approvals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Process approvals and publish via Buffer
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          UPLOAD_POST_USER: ${{ secrets.UPLOAD_POST_USER }}
          LIMESOCIAL_API_KEY: ${{ secrets.LIMESOCIAL_API_KEY }}
          LIMESOCIAL_INSTAGRAM_USERNAME: ${{ secrets.LIMESOCIAL_INSTAGRAM_USERNAME }}
          SOCIALAPI_KEY: ${{ secrets.SOCIALAPI_KEY }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: python -m src.process_approvals
      - name: Commit state
        if: always()
        run: |
          git config user.name "marketing-bot"
          git config user.email "marketing-bot@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || (git commit -m "state: $(date -u +%FT%TZ)" && git pull --rebase && git push)
