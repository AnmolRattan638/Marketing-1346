name: Approve and publish

# Safety net. Normally the Daily draft run waits for your tap and publishes instantly.
# This one catches taps made after that run ended (within Telegram's 24 hours).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: approvals
  cancel-in-progress: false

jobs:
  approvals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
      UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
      UPLOAD_POST_USER: ${{ secrets.UPLOAD_POST_USER }}
      LIMESOCIAL_API_KEY: ${{ secrets.LIMESOCIAL_API_KEY }}
      LIMESOCIAL_INSTAGRAM_USERNAME: ${{ secrets.LIMESOCIAL_INSTAGRAM_USERNAME }}
      SOCIALAPI_KEY: ${{ secrets.SOCIALAPI_KEY }}
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
    steps:
      - name: Skip while Daily draft is waiting for your tap
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow daily-draft.yml --status in_progress --json databaseId --jq 'length')
          if [ "${n:-0}" -gt 0 ]; then
            echo "Daily draft is running and handles approvals itself; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.gate.outputs.skip != 'true'
      - name: Process approvals and publish
        if: steps.gate.outputs.skip != 'true'
        run: python -m src.process_approvals
      - name: Commit state
        if: always() && steps.gate.outputs.skip != 'true'
        run: |
          bash scripts/commit_state.sh "state: $(date -u +%FT%TZ)"
