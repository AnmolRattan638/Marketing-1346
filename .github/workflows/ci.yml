name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["data/**"]       # the bot commits state to data/ every day; no need to test those
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pyflakes
      - name: Lint (pyflakes)
        run: python -m pyflakes src tests
      - name: Offline tests (no secrets, no network)
        run: |
          for t in tests/*_test.py; do
            echo "== $t"
            python "$t"
          done
