name: Daily draft

on:
  schedule:
    - cron: "30 2 * * *"      # 08:00 IST. Backup only: GitHub delays this repo's schedule by hours, see docs/SCHEDULING.md
  workflow_dispatch:
    inputs:
      force:
        description: "Redo today's draft even if one exists"
        type: boolean
        default: false
      attempt:
        description: "Automatic restart counter. The workflow sets it itself after a failure; leave it blank."
        required: false
        default: "1"

permissions:
  contents: write
  actions: write              # to start the follow-up run that keeps listening for your tap

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 355        # stays alive after sending the draft, waiting for your Approve tap
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      HUMANIZE: ${{ vars.HUMANIZE }}
      HUMANIZE_MODEL: ${{ vars.HUMANIZE_MODEL }}
      GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
      GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
      GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      WEB_RESEARCH: ${{ vars.WEB_RESEARCH }}
      WEB_RESEARCH_PROVIDERS: ${{ vars.WEB_RESEARCH_PROVIDERS }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      IDEOGRAM_API_KEY: ${{ secrets.IDEOGRAM_API_KEY }}
      IDEOGRAM_RENDERING_SPEED: ${{ vars.IDEOGRAM_RENDERING_SPEED }}
      IMAGE_ENGINE_ORDER: ${{ vars.IMAGE_ENGINE_ORDER }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
      UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
      UPLOAD_POST_USER: ${{ secrets.UPLOAD_POST_USER }}
      LIMESOCIAL_API_KEY: ${{ secrets.LIMESOCIAL_API_KEY }}
      LIMESOCIAL_INSTAGRAM_USERNAME: ${{ secrets.LIMESOCIAL_INSTAGRAM_USERNAME }}
      SOCIALAPI_KEY: ${{ secrets.SOCIALAPI_KEY }}
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      PUBLISHER_ORDER: ${{ vars.PUBLISHER_ORDER }}
      LINKEDIN_FORMAT: ${{ vars.LINKEDIN_FORMAT }}
      LINKEDIN_PUBLISHER_ORDER: ${{ vars.LINKEDIN_PUBLISHER_ORDER }}
      TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID || vars.TELEGRAM_ALLOWED_USER_ID }}
      NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
      FACTCHECK_PROVIDER: ${{ vars.FACTCHECK_PROVIDER }}
      FACTCHECK_MODEL: ${{ vars.FACTCHECK_MODEL }}
      GEMMA_MODEL: ${{ vars.GEMMA_MODEL }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      VIRALITY_REVIEW: ${{ vars.VIRALITY_REVIEW }}   # 0 = keep the virality report but never let it trigger the rewrite
      VIRALITY_LLM: ${{ vars.VIRALITY_LLM }}         # 0 = predictor fully offline (no Groq calls)
      CAROUSEL: ${{ vars.CAROUSEL }}            # set the repository variable to 0 to go back to one image per post
      GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Browser for full-article research
        continue-on-error: true
        run: |
          pip install playwright==1.49.1 && python -m playwright install --with-deps chromium
          echo "BROWSER_RESEARCH=1" >> "$GITHUB_ENV"

      - name: Generate draft and send to Telegram
        id: gen
        env:
          GITHUB_TOKEN: ${{ github.token }}      # lets the script start the reel in parallel as soon as the master script is ready
          REEL2_WITH_REEL1: ${{ vars.REEL2_WITH_REEL1 }}   # reel 2 starts together with reel 1 (set to 0 to turn off)
          PYTHONUNBUFFERED: "1"                  # live log lines
        run: |
          export RUN_DEADLINE_EPOCH=$(( $(date +%s) + 50*60 ))   # model calls stop after 50 minutes: slow providers can no longer hold the draft back for hours
          python -m src.run_daily ${{ inputs.force && '--force' || '' }}

      - name: Save draft (image links need it in the repo)
        if: always()
        run: |
          bash scripts/commit_state.sh "draft: $(date -u +%F)"

      - name: Start today's reel (only if it was not already started in parallel the moment the script was ready)
        if: steps.gen.outcome == 'success' && steps.gen.outputs.reel_started != '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REEL2_WITH_REEL1: ${{ vars.REEL2_WITH_REEL1 }}      # set the repository variable to 0 to start reel 2 only from its own timer
        run: |
          gh workflow run video-agent-fast.yml -R "$GITHUB_REPOSITORY"
          case "${REEL2_WITH_REEL1:-1}" in 0|false|off|no) ;; *) gh workflow run second-reel.yml -R "$GITHUB_REPOSITORY" || true ;; esac

      - name: Wait for your Approve tap and publish
        if: steps.gen.outcome == 'success'
        run: python -m src.process_approvals --wait 18000    # 5h; the job limit is 355 min, so even a 55-minute generation fits

      - name: Save result
        if: always()
        run: |
          bash scripts/commit_state.sh "result: $(date -u +%FT%TZ)"

      - name: Keep listening for your tap (follow-up run)
        if: always() && steps.gen.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python -m src.process_approvals --still-pending; then
            gh workflow run approve-publish.yml -R "$GITHUB_REPOSITORY" -f hop=1
          fi

      - name: Alert if the run failed
        if: failure()
        run: |
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=Daily draft workflow failed. Do NOT trust any earlier Approve button. Check the Actions tab and re-run Daily draft." > /dev/null

      - name: Start again automatically (runs AFTER the lessons above are saved, so the new run reads them)
        if: failure() && steps.gen.outcome == 'failure'        # failure() is needed: without a status function GitHub adds success() and would skip this step
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RETRY_ATTEMPT: ${{ inputs.attempt || '1' }}
          RETRY_MAX: ${{ vars.RETRY_MAX || '3' }}
          RETRY_DELAY: ${{ vars.RETRY_DELAY || '120' }}
        run: python -m src.retry --workflow daily-draft.yml
