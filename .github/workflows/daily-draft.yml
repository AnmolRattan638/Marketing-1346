name: Daily draft

on:
  schedule:
    - cron: "30 2 * * *"      # 08:00 IST every day
  workflow_dispatch:
    inputs:
      force:
        description: "Redo today's draft even if one exists"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write              # to start the follow-up run that keeps listening for your tap

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 355        # stays alive after sending the draft, waiting for your Approve tap
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
      UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
      UPLOAD_POST_USER: ${{ secrets.UPLOAD_POST_USER }}
      LIMESOCIAL_API_KEY: ${{ secrets.LIMESOCIAL_API_KEY }}
      LIMESOCIAL_INSTAGRAM_USERNAME: ${{ secrets.LIMESOCIAL_INSTAGRAM_USERNAME }}
      SOCIALAPI_KEY: ${{ secrets.SOCIALAPI_KEY }}
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      PUBLISHER_ORDER: ${{ vars.PUBLISHER_ORDER }}
      LINKEDIN_FORMAT: ${{ vars.LINKEDIN_FORMAT }}
      LINKEDIN_PUBLISHER_ORDER: ${{ vars.LINKEDIN_PUBLISHER_ORDER }}
      TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID || vars.TELEGRAM_ALLOWED_USER_ID }}
      NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
      FACTCHECK_PROVIDER: ${{ vars.FACTCHECK_PROVIDER }}
      FACTCHECK_MODEL: ${{ vars.FACTCHECK_MODEL }}
      GEMMA_MODEL: ${{ vars.GEMMA_MODEL }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      CAROUSEL: ${{ vars.CAROUSEL }}            # set the repository variable to 0 to go back to one image per post
      GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Generate draft and send to Telegram
        id: gen
        run: python -m src.run_daily ${{ inputs.force && '--force' || '' }}

      - name: Save draft (image links need it in the repo)
        if: always()
        run: |
          bash scripts/commit_state.sh "draft: $(date -u +%F)"

      - name: Wait for your Approve tap and publish
        if: steps.gen.outcome == 'success'
        run: python -m src.process_approvals --wait 18000    # 5h; the job limit is 355 min, so even a 55-minute generation fits

      - name: Save result
        if: always()
        run: |
          bash scripts/commit_state.sh "result: $(date -u +%FT%TZ)"

      - name: Keep listening for your tap (follow-up run)
        if: always() && steps.gen.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python -m src.process_approvals --still-pending; then
            gh workflow run approve-publish.yml -R "$GITHUB_REPOSITORY" -f hop=1
          fi

      - name: Alert if the run failed
        if: failure()
        run: |
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=Daily draft workflow failed. Do NOT trust any earlier Approve button. Check the Actions tab and re-run Daily draft." > /dev/null
