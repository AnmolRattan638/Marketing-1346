name: Daily draft

on:
  schedule:
    - cron: "30 2 * * *"      # 08:00 IST every day
  workflow_dispatch:
    inputs:
      force:
        description: "Redo today's draft even if one exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: marketing-state
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate draft and send to Telegram
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          FACTCHECK_PROVIDER: ${{ vars.FACTCHECK_PROVIDER }}
          FACTCHECK_MODEL: ${{ vars.FACTCHECK_MODEL }}
          GEMMA_MODEL: ${{ vars.GEMMA_MODEL }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python -m src.run_daily ${{ inputs.force && '--force' || '' }}
      - name: Commit draft, image and strategy
        if: always()
        run: bash scripts/commit_state.sh "draft: $(date -u +%F)"
      - name: Alert if the draft could not be saved
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=Daily draft workflow failed or could not save the draft. Do NOT tap Approve on any earlier draft message. Re-run Daily draft from the Actions tab." > /dev/null
