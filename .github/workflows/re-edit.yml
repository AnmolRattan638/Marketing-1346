name: Re-edit a clip

# Give it a finished clip and say what to change; it adds the motion graphics / zooms / cuts you describe and sends the result to Telegram.
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Google Drive link of the clip (share as 'Anyone with the link'), or a direct video URL"
        required: true
      instructions:
        description: "What to change, in plain words (e.g. 'around 12 s explain the 3 steps with a step graphic, zoom on the phone number, cut the pause at 20 s')"
        required: true

permissions:
  contents: read

jobs:
  reedit:
    defaults:
      run:
        working-directory: video-agent
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video-agent/template/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: video-agent/requirements.txt

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core \
            libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64 libxkbcommon0 libxfixes3

      - name: Python deps
        run: pip install -r requirements.txt

      - name: Node deps
        working-directory: video-agent/template
        run: npm ci

      - name: Re-edit
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_VIDEO: ${{ github.event.inputs.video_url }}
          INSTRUCTIONS: ${{ github.event.inputs.instructions }}
        run: python -m agent.reedit

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reedit
          path: |
            video-agent/runs/reedit-*/edited.mp4
            video-agent/runs/reedit-*/edit_plan.json
            video-agent/runs/reedit-*/transcript.txt
          if-no-files-found: ignore
