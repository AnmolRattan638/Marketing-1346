name: Voice test (Sarvam, Aayan)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sarvam-test:
    defaults:
      run:
        working-directory: video-agent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - name: Speak four test lines (one per emotion) and send them to Telegram
        env:
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/sarvam_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sarvam-test
          path: video-agent/runs/sarvam_test/
