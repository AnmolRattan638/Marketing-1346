name: Daily video (video-agent, fast environment)

on:
  # no schedule: the Daily draft workflow starts this right after it saves the draft, so the reel follows the same master script
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic (blank = next line from topics.txt)"
        required: false
      offline:
        description: "Offline test (no API calls)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

jobs:
  make-video:
    defaults:
      run:
        working-directory: video-agent
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/anmolrattan638/marketing-video-env:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    timeout-minutes: 50   # the environment is prebuilt (no apt/pip); the reel itself is capped at 38 min below
    steps:
      - uses: actions/checkout@v4

      - name: Edits folder cache (Google Drive downloads are re-used between runs)
        uses: actions/cache@v4
        with:
          path: video-agent/edits_cache
          key: edits-${{ github.run_id }}
          restore-keys: edits-

      - name: Memory between runs (planner mistakes to avoid, last templates / looks used)
        uses: actions/cache/restore@v4
        with:
          path: video-agent/state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Node deps
        working-directory: video-agent/template
        run: npm ci

      - name: Generate placeholder SFX if missing
        run: |
          if [ -z "$(ls assets/sfx/*.mp3 2>/dev/null)" ]; then bash scripts/make_sfx.sh; fi

      - name: Make video
        timeout-minutes: 38       # below the job's 60 so the alert step below still runs
        env:
          PYTHONUNBUFFERED: "1"   # progress lines reach the log live (buffered output was lost when a run was cancelled)
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          FACTCHECK_PROVIDER: ${{ vars.FACTCHECK_PROVIDER }}
          FACTCHECK_MODEL: ${{ vars.FACTCHECK_MODEL }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          WEB_RESEARCH: ${{ vars.WEB_RESEARCH }}
          WEB_RESEARCH_PROVIDERS: ${{ vars.WEB_RESEARCH_PROVIDERS }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          EDITS_DRIVE_URL: ${{ secrets.EDITS_DRIVE_URL }}
          VOICE_REF_B64: ${{ secrets.VOICE_REF_B64 }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC: ${{ github.event.inputs.topic }}
        run: |
          set -o pipefail
          export RUN_DEADLINE_EPOCH=$(( $(date +%s) + 32*60 ))     # model calls stop after 32 minutes, leaving time to render and report
          if [ "${{ github.event.inputs.offline }}" = "true" ]; then
            python -m agent.run --offline 2>&1 | tee "$RUNNER_TEMP/reel.log"
          else
            python -m agent.run 2>&1 | tee "$RUNNER_TEMP/reel.log"
          fi

      - name: Tell me on Telegram when the reel did not finish
        if: failure() || cancelled()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          tail_log=$(grep -v "DeprecationWarning\|trace-deprecation" "$RUNNER_TEMP/reel.log" 2>/dev/null | tail -8 | cut -c1-300)
          msg=$(printf "Today's reel did NOT finish (failed or ran out of time). Nothing was posted.\nLast lines:\n%s\n%s" "${tail_log:-no log lines}" "$RUN_URL")
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="$TELEGRAM_CHAT_ID" --data-urlencode text="$msg" > /dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-output
          path: video-agent/runs/
          retention-days: 14

      - name: Save memory (also after a failed run, which is when planner lessons are written)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: video-agent/state
          key: state-${{ github.run_id }}
