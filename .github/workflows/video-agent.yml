name: Daily video (video-agent)

on:
  # no schedule: the Daily draft workflow starts this right after it saves the draft, so the reel follows the same master script
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic (blank = next line from topics.txt)"
        required: false
      offline:
        description: "Offline test (no API calls)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  make-video:
    defaults:
      run:
        working-directory: video-agent
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video-agent/template/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: video-agent/requirements.txt

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core espeak-ng \
            libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64 libxkbcommon0 libxfixes3

      - name: Python deps
        run: |
          pip install -r requirements.txt
          # Kokoro (CPU torch) is large; comment out to use edge-tts only
          pip install -r requirements-kokoro.txt || echo "kokoro install failed, falling back to edge-tts"
          # your cloned voice: only when voice_engine is "chatterbox" in config.json and the secret exists
          if grep -q '"voice_engine": "chatterbox"' config.json; then pip install -r requirements-chatterbox.txt || echo "chatterbox install failed, falling back to kokoro"; fi

      - name: Edits folder cache (Google Drive downloads are re-used between runs)
        uses: actions/cache@v4
        with:
          path: video-agent/edits_cache
          key: edits-${{ github.run_id }}
          restore-keys: edits-

      - name: Node deps
        working-directory: video-agent/template
        run: npm ci

      - name: Generate placeholder SFX if missing
        run: |
          if [ -z "$(ls assets/sfx/*.mp3 2>/dev/null)" ]; then bash scripts/make_sfx.sh; fi

      - name: Make video
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          WEB_RESEARCH: ${{ vars.WEB_RESEARCH }}
          WEB_RESEARCH_PROVIDERS: ${{ vars.WEB_RESEARCH_PROVIDERS }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          EDITS_DRIVE_URL: ${{ secrets.EDITS_DRIVE_URL }}
          VOICE_REF_B64: ${{ secrets.VOICE_REF_B64 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC: ${{ github.event.inputs.topic }}
        run: |
          if [ "${{ github.event.inputs.offline }}" = "true" ]; then
            python -m agent.run --offline
          else
            python -m agent.run
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-output
          path: video-agent/runs/
          retention-days: 14
