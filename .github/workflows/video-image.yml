name: Build reel environment image

# Builds the container the fast reel workflow runs in (video-agent/Dockerfile). Rebuilt only when the Dockerfile or the Python requirements change.
on:
  push:
    branches: [main]
    paths:
      - video-agent/Dockerfile
      - video-agent/requirements.txt
      - video-agent/requirements-kokoro.txt
      - .github/workflows/video-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')/marketing-video-env:latest
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "$IMAGE" video-agent -f video-agent/Dockerfile
          echo "--- smoke test: every tool the reel needs must exist in the image"
          docker run --rm "$IMAGE" bash -c 'ffmpeg -version | head -1 && node -v && python --version && espeak-ng --version | head -1 && python -c "import requests, jsonschema, edge_tts, numpy; print(\"python deps ok\")" && (python -c "import kokoro; print(\"kokoro ok\")" || echo "kokoro missing (edge-tts fallback)")'
          docker push "$IMAGE"
          echo "published $IMAGE"
