name: Weekly learning review

# Every Monday 09:00 IST: score last week's posts against the account's own median, update the problem bank,
# and send you a short summary in Telegram (including which screenshots would help). Data files only: no prompt or code is changed.
on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Weekly review
        run: python -m src.weekly_review

      - name: Save review
        if: always()
        run: |
          bash scripts/commit_state.sh "learning review: $(date -u +%F)"
