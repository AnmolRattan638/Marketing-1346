[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-humanizer"
version = "1.0.0"
description = "Open-source adversarial AI text humanizer — free alternative to paid ZeroGPT humanizers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Open Source Community" }]
keywords = [
    "ai humanizer",
    "zerogpt",
    "ai detector",
    "humanize ai text",
    "undetectable ai",
    "burstiness",
    "perplexity",
    "open source",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0"]

[project.scripts]
open-humanizer = "open_humanizer.cli:main"

[project.urls]
Homepage = "https://github.com/pandeyvishwas51-oss/open-humanizer"
Documentation = "https://github.com/pandeyvishwas51-oss/open-humanizer#readme"
Repository = "https://github.com/pandeyvishwas51-oss/open-humanizer"
Issues = "https://github.com/pandeyvishwas51-oss/open-humanizer/issues"

[tool.setuptools.packages.find]
exclude = ["tests*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
